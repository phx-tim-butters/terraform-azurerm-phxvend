name: Release

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate README.md with terraform-docs
        uses: terraform-docs/gh-actions@main
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          git-push: "true"
          git-commit-message: "Update README.md on ${{ github.ref_name }} by ${{ github.actor }}"
          git-push-user-name: ${{ github.actor }}
          git-push-user-email: "${{ github.actor }}@users.noreply.github.com"
          git-push-sign-off: true
          config-file: .terraform-docs.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select version increment
        id: increment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_INCREMENT: ${{ inputs.increment }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "value=${REQUESTED_INCREMENT:-patch}" >> "$GITHUB_OUTPUT"
          else
            echo "value=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx release-it "${{ steps.increment.outputs.value }}" --ci
